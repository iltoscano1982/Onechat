<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="OneChat"><title>OneChat</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f6f8ff;background:#101827}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}header{padding:28px 0 20px}h1{font-size:32px;margin:0}p{color:#9baec5}input{width:100%;padding:15px;border:1px solid #39465b;background:#1c293b;color:white;border-radius:14px;font-size:16px}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tabs button{border:0;border-radius:20px;padding:10px 16px;background:#26364c;color:white}.tabs button.active{background:#2868ee}.item{width:100%;display:flex;align-items:center;gap:14px;background:#1c293b;border:0;border-radius:16px;padding:16px;margin:10px 0;color:white;text-align:left;font-size:16px;cursor:pointer}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;font-size:22px;font-weight:700}.detail{flex:1}.detail small{display:block;color:#a9b9cd;margin-top:5px}.arrow{color:#8ea3c2}footer{margin:25px 0;color:#8296ae;font-size:13px;line-height:1.5}</style></head><body><header><h1>💬 OneChat</h1><p>I tuoi social, un unico punto di partenza</p></header><input id="search" placeholder="Cerca un'app..." aria-label="Cerca un'app"><div class="tabs"><button class="active" data-filter="all">Tutti</button><button data-filter="chat">Chat</button><button data-filter="social">Social</button></div><main id="list"></main><footer>OneChat apre le app originali. Non legge messaggi, notifiche o credenziali. Per la sicurezza, accedi sempre nelle app ufficiali.</footer><script>const apps=[{name:'WhatsApp',letter:'W',color:'#1d9c5b',url:'https://wa.me/',type:'chat'},{name:'Telegram',letter:'T',color:'#249bd7',url:'https://t.me/',type:'chat'},{name:'Messenger',letter:'M',color:'#2479e9',url:'https://www.messenger.com/',type:'chat'},{name:'Instagram',letter:'I',color:'#b64283',url:'https://www.instagram.com/direct/inbox/',type:'social'},{name:'TikTok',letter:'♪',color:'#222',url:'https://www.tiktok.com/',type:'social'},{name:'Signal',letter:'S',color:'#3269d8',url:'https://signal.org/',type:'chat'},{name:'SMS / iMessage',letter:'✉',color:'#34a853',url:'sms:',type:'chat'}];let filter='all';const list=document.getElementById('list'),search=document.getElementById('search');function render(){let q=search.value.trim().toLocaleLowerCase('it');let found=apps.filter(a=>(filter==='all'||a.type===filter)&&a.name.toLocaleLowerCase('it').includes(q));list.replaceChildren();for(const a of found){let b=document.createElement('button');b.className='item';let logo=document.createElement('span');logo.className='logo';logo.style.background=a.color;logo.textContent=a.letter;let d=document.createElement('span');d.className='detail';let name=document.createElement('strong');name.textContent=a.name;let hint=document.createElement('small');hint.textContent='Apri il servizio originale';d.append(name,hint);let arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';b.append(logo,d,arrow);b.addEventListener('click',()=>{location.href=a.url});list.append(b)}if(!found.length){let p=document.createElement('p');p.textContent='Nessuna app trovata';list.append(p)}}search.addEventListener('input',render);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}));render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
